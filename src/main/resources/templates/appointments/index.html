<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head th:replace="~{fragments/layout :: head(Appointments)}"></head>

<body>

    <div th:replace="~{fragments/layout :: navbar}"></div>
    <main>
        <div sec:authorize="hasRole('PATIENT')">
        <h1>Your Appointments</h1>
        <table>
            <thead>
            <tr>
                <th>Date</th>
                <th>Time</th>
                <th>Doctor</th>
                <th>Status</th>
                <th>Update Appointment</th>
                <th>Cancel Appointment</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="appointment : ${appointments}">
                <td th:text="${#temporals.format(appointment.appointmentDateTime, 'dd/MM/yyyy')}"></td>
                <td th:text="${#temporals.format(appointment.appointmentDateTime, 'HH:mm')}"></td>
                <td th:text="${appointment.doctor.firstName + ' ' + appointment.doctor.lastName}"></td>
                <td th:text="${appointment.status}"></td>
                <td>
                    <form th:action="@{/appointments/update}" method="post">
                        <input type="hidden" name="appointmentID" th:value="${appointment.appointmentID}"/>
                        <select name="newAppointmentDateTime" required>
                            <option value="">-- Select new slot --</option>
                            <option th:each="slot : ${slotsByDoctor[appointment.doctor.doctorID]}"
                                    th:value="${slot}"
                                    th:text="${#temporals.format(slot, 'EEE, MMM d - HH:mm')}"></option>
                        </select>
                        <button type="submit">Submit Request</button>
                    </form>
                </td>
                    <td>
                        <form th:action="@{/appointments/cancel}" method="post">
                            <input type="hidden" name="appointmentID" th:value="${appointment.appointmentID}"/>
                            <button type="submit">Cancel Appointment</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <h1>Request New Appointment</h1>
            <form th:action="@{/appointments/create}" th:object="${createRequest}" method="post">

                <div>
                    <label for="doctorID">Doctor:</label>
                    <select id="doctorID" name="doctorID"
                            onchange="if(this.value) window.location.href='/appointments?selectedDoctorID=' + this.value;" required>
                        <option value="">-- Select a Doctor --</option>
                        <option th:each="doc : ${doctors}"
                                th:value="${doc.doctorID}"
                                th:text="${doc.firstName + ' ' + doc.lastName}"
                                th:selected="${doc.doctorID == selectedDoctorID}">
                        </option>
                    </select>
                </div>

                <div>
                    <label for="appointmentDateTime">Available Date & Time:</label>
                    <select id="appointmentDateTime" th:field="*{appointmentDateTime}" required>
                        <option value="">-- Select Date & Time --</option>

                        <option th:each="slot : ${availableSlots}"
                                th:value="${slot}"
                                th:text="${#temporals.format(slot, 'EEEE, MMM d, yyyy - HH:mm')}">
                            Monday, Oct 26, 2026 - 09:00
                        </option>
                    </select>
                </div>

                <button type="submit">Book Appointment</button>
            </form>
        </div>

        <div sec:authorize="hasRole('DOCTOR')">
            <h1>Your Appointments</h1>

            <table>
                <thead>
                <tr>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Patient</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appointment : ${appointments}">
                    <td th:text="${#temporals.format(appointment.appointmentDateTime, 'dd/MM/yyyy')}"></td>
                    <td th:text="${#temporals.format(appointment.appointmentDateTime, 'HH:mm')}"></td>
                    <td th:text="${appointment.patient.firstName + ' ' + appointment.patient.lastName}"></td>
                    <td th:text="${appointment.status}"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
