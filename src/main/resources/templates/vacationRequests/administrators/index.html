<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Administrator - Vacation Requests')}"></head>
<body sec:authorize="hasRole('ADMINISTRATOR')">

<div th:replace="~{fragments/layout :: navbar}"></div>

<main>
    <h1>Vacation Requests</h1>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Doctor Name</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="vr : ${pendingRequests}">
                <td th:text="${vr.vacationRequestID}"></td>
                <td th:text="${vr.doctor.firstName + ' ' + vr.doctor.lastName}"></td>
                <td th:text="${vr.startDate}"></td>
                <td th:text="${vr.endDate}"></td>
                <td>
                    <form th:action="@{/vacationRequests/administrators/approve}" method="post" style="display:inline;">
                        <input type="hidden" name="vacationRequestID" th:value="${vr.vacationRequestID}"/>
                        <button type="submit">Approve</button>
                    </form>

                    <form th:action="@{/vacationRequests/administrators/deny}" method="post" style="display:inline;">
                        <input type="hidden" name="vacationRequestID" th:value="${vr.vacationRequestID}"/>
                        <button type="submit">Deny</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(pendingRequests)}">
                <td colspan="4">No Vacation Requests Found</td>
            </tr>
        </tbody>
    </table>
</main>

</body>
</html>
