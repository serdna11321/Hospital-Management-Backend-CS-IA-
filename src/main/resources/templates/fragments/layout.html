<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title}">Hospital Management</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>

<nav th:fragment="navbar">
    <ul>
        <li><strong>Clinic</strong></li>
    </ul>
    <ul>
        <li sec:authorize="hasRole('PATIENT')">
            <a th:href="@{/appointments}">My Appointments</a>
        </li>

        <li sec:authorize="hasRole('DOCTOR')">
            <a th:href="@{/appointments}">My Schedule</a>
        </li>
        <li sec:authorize="hasRole('DOCTOR')">
            <a th:href="@{/vacationRequests/doctors}">Request Vacation</a>
        </li>

        <li sec:authorize="hasRole('ADMINISTRATOR')">
            <a th:href="@{/users/administrators}">Manage Doctor and Administrators</a>
        </li>
        <li sec:authorize="hasRole('ADMINISTRATOR')">
            <a th:href="@{/vacationRequests/administrators}">Vacation Requests</a>
        </li>

        <li sec:authorize="isAuthenticated()">
            <form th:action="@{/auth/logout}" method="post" style="margin:0">
                <button type="submit" class="secondary outline">Logout</button>
            </form>
        </li>

        <li sec:authorize="!isAuthenticated()">
            <a th:href="@{/auth}">Login</a>
        </li>
    </ul>
</nav>
</body>
</html>
