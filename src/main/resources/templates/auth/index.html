<!DOCTYPE html>
<html xmnls:th="http://www.thymeleaf.org" xmlns:xmnls="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/layout :: head('Login')}">
    <meta charset="UTF-8">
</head>
<body>

    <main>
        <div th:if="${error}" style="color: red;">
            <p th:text="${error}"></p>
        </div>

        <h1>Login</h1>

        <form th:action="@{/auth}" th:object="${login}" method="post">
            <div>
                <label for="email"></label>
                <input name="email" id="email" type="email" th:field="*{email}"/>
            </div>

            <div>
                <label for="password"></label>
                <input name="password" id="password" type="password" th:field="*{password}"/>
            </div>

            <div>
                <button type="submit">Login</button>
            </div>
        </form>

        <p>Don't have an account? <a th:href="@{/users/patients}">Create an account</a></p>
    </main>

</body>
</html>
